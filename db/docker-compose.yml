version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: app_db
      MYSQL_USER: user123
      MYSQL_PASSWORD: user123
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: